name: Aepona
description: 'Aepona was a telecommunications software company founded in 1999 and headquartered
  in Belfast, Northern Ireland, with additional offices in Dublin, the United States, and Sri
  Lanka. Its Network-as-a-Service platform let mobile network operators and cloud service providers
  expose carrier network capabilities — messaging, voice, location, identity, and carrier billing
  — to third-party developers through common-language REST APIs, and merchandize them through
  multi-sided business models. Backed by Amadeus Capital Partners and Sapphire Ventures, Aepona
  was acquired by Intel in April 2013 for approximately $124 million and folded into Intel''s
  software and services group alongside the Mashery API-management acquisition. The company is
  no longer operating independently and its developer surface is defunct; this profile is retained
  as a historical record within the API Evangelist network.'
